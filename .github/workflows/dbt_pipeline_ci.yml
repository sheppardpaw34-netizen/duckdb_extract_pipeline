name: dbt Analytics Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-data-pipeline-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Initialize Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dbt Core and DuckDB Adapter
      run: |
        python -m pip install --upgrade pip
        pip install dbt-core dbt-duckdb duckdb requests beautifulsoup4
    - name: Run Python Ingestion Scrapers
      run: |
        cd saas_analytics
        python ../scraper_py/scraper.py
        python ../scraper_py/generate_fact.py

    - name: Download dbt Dependencies
      run: |
        cd saas_analytics
        dbt deps || echo "No packages configured"

    - name: Compile and Run dbt Assertions
      run: |
        cd saas_analytics
        dbt compile --profiles-dir .
        dbt run --select stg_subscription_events+ --profiles-dir .