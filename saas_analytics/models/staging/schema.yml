version: 2 
models:
  - name: stg_customers
    description: >
      Staged entity model for saas account profiles ingested from payment processing systems.
      Serves as a primary parent model for customer-level roll up metrics, churn attribution
      and chort retention analysis.
    columns:
      - name: customer_id
        description: "Primary key. Uniqe identifier assigned to each customer account."
        data_tests: 
          - not_null
          - unique
      - name: email
        description: "Primary electronic contact address associated with account profile."
        data_tests:
          - not_null
      - name: created_at
        description: "Timestamp indicating initial customer profile registration and onboarding start."
        data_tests:
          - not_null
  - name: stg_subscriptions
    description: >
      Staged transaction table capturing recurring billing lifecycle events,status change,subscription plan daynamics
      core source for mrr watefalls and revenue retention modeling
    columns:
      - name: subscription_id
        description:  "Primary key. Unique identifier for individual recurring contact."
        data_tests:
          - not_null
          - unique
      - name: status
        description: "Current status machine status: 'active','trialing','past_due',or'canceled'."
        data_tests:
          - not_null
          - accepted_values:
              values: ['active','trialing','past_due','canceled']

      - name: mrr_amount
        description: "Normalized Monthly Recurring Revenue generated by the subscription contract."
        data_tests:
          - not_null

      - name: created_at
        description: "Timestamp marking subscription activation or contract commencement."
        data_tests:
          - not_null

      - name: canceled_at
        description: "Timestamp recording account cancellation request. Remains NULL for active accounts."